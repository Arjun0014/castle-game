<!doctype html>
<html lang="en" style="background:#050404;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Echoes of Caer Veyr</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 2 L27 16 L16 30 L5 16 Z%27 fill=%27%23b3242a%27 stroke=%27%23d8b36a%27 stroke-width=%272%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="app"></div>
      <div id="hud"></div>
      <div id="overlay"></div>
      <!-- test hook: dev probes click it to start play without the menu (main.ts) -->
      <button id="start-btn" hidden></button>
    </div>
    <!-- shown by the game only (Platform: a phone held upright in a frame that does not turn for it); hidden here so a
         page whose styles never arrived cannot show it by mistake -->
    <div id="rotate" hidden>
      <div class="rotate-card">
        <div class="rotate-phone"></div>
        <p class="rotate-msg">Turn your device sideways</p>
        <small class="rotate-sub">Caer Veyr is played in landscape</small>
      </div>
    </div>
    <!-- before the game's code arrives: a plain line on the dark page; if it never arrives (a broken upload, no
         connection), say so instead of leaving a blank frame. main.ts removes it (window.__booted). -->
    <div id="boot-note" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#050404;color:#b99a62;font:13px/1.6 Georgia,serif;letter-spacing:0.28em;text-align:center;z-index:200">ECHOES OF CAER VEYR</div>
    <script>
      // a slow connection (or a dev server compiling) first hears "still loading"; only a minute and a half without the
      // game's code says it did not load
      setTimeout(function () {
        var n = document.getElementById('boot-note');
        if (n && !window.__booted) n.textContent = 'Still loading — this can take a moment on a slow connection.';
      }, 20000);
      setTimeout(function () {
        var n = document.getElementById('boot-note');
        if (n && !window.__booted) n.textContent = 'The game files did not load. Please reload the page.';
      }, 90000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
